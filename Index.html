<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بطاقة التواصل</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        .card {
            width: 340px;
            padding: 35px 25px;
            background: white;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            color: #222;
            font-size: 25px;
        }

        .job {
            margin-top: 8px;
            margin-bottom: 28px;
            color: #777;
            font-size: 15px;
        }

        .contact {
            display: block;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            background: #f4f4f4;
            color: #222;
            text-decoration: none;
            font-size: 15px;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .contact:hover {
            background: #e7e7e7;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="avatar">ف</div>

        <h1>فراس البراك</h1>

        <div class="job">
            Cybersecurity
        </div>

        <a class="contact" href="mailto:example@email.com">
            📧 example@email.com
        </a>

        <a class="contact" href="tel:+966500000000">
            📱 +966 50 000 0000
        </a>

    </div>

</body>

</html>
