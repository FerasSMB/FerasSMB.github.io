<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراس البراك</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #e4e5e7;
            --ink: #23282f;
            --line: #a3a5a9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: var(--bg);
            color: var(--ink);
            font-family: "IBM Plex Sans Arabic", Arial, sans-serif;
            font-weight: 300;
        }

        main {
            width: 100%;
            max-width: 440px;
            padding: 0 24px;
            text-align: center;
        }

        .stem {
            position: relative;
            width: 1px;
            height: 70px;
            margin: 0 auto;
            background: var(--line);
        }

        .stem::before {
            content: "";
            position: absolute;
            top: -3px;
            left: -2px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--line);
        }

        .stem.top {
            height: 50px;
            margin-bottom: 20px;
        }

        .stem.bottom {
            height: 80px;
            margin-top: 0;
        }

        .name {
            display: inline-block;
        }

        h1 {
            margin: 0;
            padding: 0 4px;
            font-size: 34px;
            font-weight: 400;
            line-height: 1.4;
            white-space: nowrap;
        }

        .underline {
            width: 100%;
            height: 3px;
            margin: 4px 0 0;
            background: var(--ink);
            border-radius: 3px;
        }

        .job {
            margin: 22px 0 0;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: 400;
            line-height: 1.4;
        }

        .stem.mid {
            height: 90px;
            margin-top: 20px;
            margin-bottom: 0;
        }

        .list {
            direction: ltr;
            border-top: 1px solid var(--line);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 0 12px;
            height: 78px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: 300;
            text-align: left;
        }

        .row svg {
            flex: none;
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--ink);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .row:hover,
        .row:focus-visible {
            background: rgba(0, 0, 0, 0.05);
            outline: none;
        }
    </style>
</head>

<body>

    <main>

        <div class="stem top"></div>

        <div class="name">
            <h1>فراس البراك</h1>
            <div class="underline"></div>
        </div>

        <p class="job">Cybersecurity</p>

        <div class="stem mid"></div>

        <div class="list">

            <a class="row" href="tel:+966553139775">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" />
                    <path d="M15 4a5 5 0 0 1 5 5M15 7.5a1.5 1.5 0 0 1 1.5 1.5" />
                </svg>
                <span>+966 55 313 9775</span>
            </a>

            <a class="row" href="mailto:ferasalbrrak@gmail.com">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="M3 7l9 6 9-6" />
                </svg>
                <span>ferasalbrrak@gmail.com</span>
            </a>

            <a class="row" href="https://drive.google.com/file/d/1AXiuW2O12C9PZ909keqN3L2DQXTgYkVB/view" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3h8l4 4v14H6z" />
                    <path d="M14 3v4h4M9 12h6M9 16h6" />
                </svg>
                <span>Resume</span>
            </a>

        </div>

        <div class="stem bottom"></div>

    </main>

</body>

</html>
